name: Verify DefectDojo Access (Private Tailscale)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: verify-defectdojo-access
  cancel-in-progress: false

jobs:
  verify-access:
    name: Validar Acesso Privado e Importacao DefectDojo
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validar Segredos de Seguranca
        shell: bash
        run: |
          missing=()
          [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ] && missing+=("TS_OAUTH_CLIENT_ID")
          [ -z "${{ secrets.TS_AUDIENCE }}" ] && missing+=("TS_AUDIENCE")
          [ -z "${{ secrets.DEFECTDOJO_TOKEN }}" ] && missing+=("DEFECTDOJO_TOKEN")
          [ -z "${{ secrets.DEFECTDOJO_URL }}" ] && missing+=("DEFECTDOJO_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Segredos ausentes nos Secrets do repositorio: ${missing[*]}"
            exit 1
          fi

      - name: Instalar CA Raiz do Caddy no Sistema Operacional (Confianca TLS)
        if: env.CADDY_CA != ''
        env:
          CADDY_CA: ${{ secrets.CADDY_ROOT_CA }}
        run: |
          echo "$CADDY_CA" | sudo tee /usr/local/share/ca-certificates/caddy-internal.crt
          sudo update-ca-certificates

      - name: Provar Inacessibilidade Externa (Fora da Tailscale)
        shell: bash
        run: |
          echo "Testando requisicao para https://bigdevz-vps.tailf827e2.ts.net antes de conectar a Tailscale..."
          set +e
          curl -m 5 -sI https://bigdevz-vps.tailf827e2.ts.net
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "OK: Painel e API estao 100% inacessiveis na internet publica (exit code $EXIT_CODE)."
          else
            echo "::error::Falha de isolamento: DefectDojo respondeu na internet publica!"
            exit 1
          fi

      - name: Conectar a Tailscale via OIDC (Rede Mesh Privada)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-defectdojo

      - name: Validar Conexao Privada e Confianca no Certificado HTTPS
        shell: bash
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
        run: |
          echo "Disparando requisicao HTTPS com validacao estrita de certificado..."
          RESPONSE_CODE=$(curl -s --resolve bigdevz-vps.tailf827e2.ts.net:443:100.90.8.15 -o /dev/null -w "%{http_code}" "$DOJO_URL/login?next=/")
          echo "HTTP Response Code via Tailscale: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" = "200" ] || [ "$RESPONSE_CODE" = "302" ]; then
            echo "OK: Conexao HTTPS autenticada via Tailscale com certificado TLS 100% valido e confiavel."
          else
            echo "::error::Resposta inesperada: $RESPONSE_CODE"
            exit 1
          fi

      - name: Validar Escopo e Menor Privilegio da Conta de Servico
        shell: bash
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          echo "Consultando dados da conta de servico..."
          USER_PROFILE=$(curl -sf --resolve bigdevz-vps.tailf827e2.ts.net:443:100.90.8.15 -H "Authorization: Token $DOJO_TOKEN" "$DOJO_URL/api/v2/user_profile/")
          IS_SUPERUSER=$(echo "$USER_PROFILE" | jq -r '.user.is_superuser // false')
          IS_STAFF=$(echo "$USER_PROFILE" | jq -r '.user.is_staff // false')
          USERNAME=$(echo "$USER_PROFILE" | jq -r '.user.username')
          echo "Usuario autenticado: $USERNAME (is_superuser: $IS_SUPERUSER, is_staff: $IS_STAFF)"
          if [ "$IS_SUPERUSER" = "false" ]; then
            echo "OK: Conta de servico opera sem privilegios de superusuario (is_superuser: false)."
          else
            echo "::error::Conta possui privilegios de superusuario indevidos!"
            exit 1
          fi

          echo "Verificando restricao de operacoes administrativas (Fail-Closed)..."
          HTTP_STATUS=$(curl -s --resolve bigdevz-vps.tailf827e2.ts.net:443:100.90.8.15 -o /dev/null -w "%{http_code}" -X POST "$DOJO_URL/api/v2/users/" \
            -H "Authorization: Token $DOJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"username":"probe_admin"}')
          echo "Tentativa de escrita administrativa retornou HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "401" ]; then
            echo "OK: Conta de servico estritamente bloqueada contra acoes administrativas."
          else
            echo "::error::Resposta inesperada para tentativa de criacao de usuario: $HTTP_STATUS"
            exit 1
          fi

      - name: Validar Bloqueio de Importacao em Outro Produto (Cross-Product Isolation)
        shell: bash
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          echo "Testando tentativa de importacao no produto nao autorizado 'ERP'..."
          echo '{"SchemaVersion":2,"ArtifactName":"test","Results":[]}' > probe-scan.json
          HTTP_STATUS=$(curl -s --resolve bigdevz-vps.tailf827e2.ts.net:443:100.90.8.15 -o /dev/null -w "%{http_code}" -X POST "$DOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DOJO_TOKEN" \
            -F "scan_type=Trivy Scan" \
            -F "product_name=ERP" \
            -F "engagement_name=CI Security Pipeline" \
            -F "test_title=Probe Unauthorized" \
            -F "file=@probe-scan.json")
          echo "Tentativa de importacao cruzada retornou HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "400" ] || [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "OK: Importacao no produto 'ERP' estritamente rejeitada para a conta do ProPatch BR."
          else
            echo "::error::Falha de isolamento: Conta conseguiu importar em produto nao autorizado! (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Executar Varredura de Seguranca Trivy
        shell: bash
        run: |
          echo "Instalando Trivy no runner..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy fs --format json -o trivy-propatchbr-ci.json .

      - name: Avaliar Politica de Promocao de Seguranca
        shell: bash
        run: |
          python3 scripts/eval-promotion-policy.py \
            --scan trivy-propatchbr-ci.json \
            --baseline security/baseline.json \
            --mode audit \
            --output-summary $GITHUB_STEP_SUMMARY

      - name: Reimportar Varredura no DefectDojo (Destino Estavel)
        shell: bash
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          echo "Reimportando scan para ProPatch BR via API v2 reimport-scan no destino de teste estavel (Test ID 30)..."
          set +e
          RESPONSE=$(curl -sf --resolve bigdevz-vps.tailf827e2.ts.net:443:100.90.8.15 -X POST "$DOJO_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token $DOJO_TOKEN" \
            -F "scan_type=Trivy Scan" \
            -F "test=30" \
            -F "active=true" \
            -F "verified=false" \
            -F "close_old_findings=true" \
            -F "file=@trivy-propatchbr-ci.json")
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ] || [ -z "$RESPONSE" ]; then
            echo "::warning::Falha ao reimportar varredura no DefectDojo (exit code $CURL_EXIT). O relatorio JSON foi preservado como artefato privado do job."
          else
            TEST_ID=$(echo "$RESPONSE" | jq -r '.test // .test_id // empty')
            PRODUCT_ID=$(echo "$RESPONSE" | jq -r '.product_id // empty')
            echo "OK: Varredura reimportada com sucesso no DefectDojo no Test ID estavel: $TEST_ID (Product ID: $PRODUCT_ID)"
            if [ "$TEST_ID" != "30" ]; then
              echo "::error::Test ID inesperado retornado pela API: $TEST_ID (esperava 30)"
              exit 1
            fi
          fi

      - name: Preservar Relatorio de Seguranca como Artefato Privado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-propatchbr-dev
          path: trivy-propatchbr-ci.json
          retention-days: 14
          if-no-files-found: ignore
